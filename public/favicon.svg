<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6595" />
      <stop offset="50%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#D81B60" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF5F8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#55001E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Rounded Background for iOS / Android Homescreen -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border Glow -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6" />

  <!-- Main Illustration Group with Drop Shadow -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    
    <!-- Open Book Pages (Left & Right) -->
    <path d="M256 360 C210 320 140 315 90 325 C80 327 72 320 72 310 L72 170 C72 160 82 153 92 150 C146 140 215 145 256 185 Z" fill="url(#bookGrad)" />
    <path d="M256 360 C302 320 372 315 422 325 C432 327 440 320 440 310 L440 170 C440 160 430 153 420 150 C366 140 297 145 256 185 Z" fill="url(#bookGrad)" />
    
    <!-- Book Spine & Ribbon -->
    <path d="M252 180 L260 180 L260 365 L252 365 Z" fill="#FF80AB" />
    <path d="M250 185 L250 395 L256 385 L262 395 L262 185 Z" fill="#C2185B" />

    <!-- Cute Blossom / Lotus Flower in Center -->
    <g transform="translate(256, 210)">
      <path d="M0 -45 C-25 -25 -25 10 0 35 C25 10 25 -25 0 -45 Z" fill="#FF4081" />
      <path d="M-35 -15 C-45 10 -15 25 0 35 C-15 15 -20 -5 -35 -15 Z" fill="#FF80AB" />
      <path d="M35 -15 C45 10 15 25 0 35 C15 15 20 -5 35 -15 Z" fill="#FF80AB" />
      <circle cx="0" cy="15" r="10" fill="url(#goldGrad)" />
    </g>

    <!-- Floating Sparkles & Crown -->
    <path d="M256 95 L264 120 L289 128 L264 136 L256 161 L248 136 L223 128 L248 120 Z" fill="url(#goldGrad)" />
    <circle cx="140" cy="115" r="8" fill="#FFF" opacity="0.95" />
    <circle cx="372" cy="115" r="8" fill="#FFF" opacity="0.95" />
    <circle cx="392" cy="138" r="5" fill="#FFE082" />
    <circle cx="120" cy="138" r="5" fill="#FFE082" />
  </g>

  <!-- "4.0" Badge in Bottom Right Corner -->
  <g transform="translate(335, 360)">
    <rect width="125" height="56" rx="28" fill="url(#goldGrad)" filter="url(#shadow)" />
    <text x="62" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#5D0038" text-anchor="middle">4.0 👑</text>
  </g>
</svg>